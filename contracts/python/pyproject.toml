[project]
name = "bellasreef-contracts"
version = "3.7.0"
description = "Versioned wire contracts for Bella's Reef: NATS subjects, message payloads, driver interface"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
]

# This package's version IS the contract version. See docs/contracts/nats-subjects.md
# for the semver policy: MAJOR bumps are migrations, not upgrades.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellasreef_contracts"]
