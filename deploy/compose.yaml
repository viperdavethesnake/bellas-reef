# Bella's Reef — deployment topology. All five services, containers only.
#
# Spine images (nats, postgres, victoria-metrics) are digest-pinned. Digests
# resolved from the registry on 2026-08-09 and verified present; a tag can be
# moved upstream, a digest cannot. To re-resolve after a deliberate version
# bump:
#
#   docker buildx imagetools inspect <image>:<tag> --format '{{.Manifest.Digest}}'
#
# Note on VictoriaMetrics: the 1.136 LTS line is published on Docker Hub as
# ENTERPRISE-ONLY — v1.136.11, v1.136.15 and their -lts spellings all return
# 404, while v1.136.11-enterprise returns 200. v1.149.0 is the current OSS
# mainline. If an OSS LTS line is wanted, that question is unresolved and does
# not have a Docker Hub answer today.
#
# App images (hardware-io, control-engine, api) are pulled by SHA tag —
# `image:` is set alongside `build:` so `docker compose pull` (deploys) and
# `docker compose build` (dev) both work from the same file; compose prefers
# `image:` unless `--build` is given. BELLASREEF_TAG is set by deploy-pi.sh
# to the commit SHA it just verified; it defaults to :latest for local dev.

name: bellasreef

services:
  # ------------------------------------------------------------- spine
  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"   # loopback only; clients reach the API, not NATS
      - "127.0.0.1:8222:8222"   # monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------- state
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      # Deterministic collation; avoids index corruption across libc upgrades.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu"
    ports:
      # App containers reach Postgres over the compose network as
      # postgres:5432 (see BELLASREEF_DATABASE_URL below); this loopback
      # publish is for host-side psql/pg_dump access only.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.149.0@sha256:13b8951e35bb3589626816538483127785a9d8b53f9f5123769db0fcab1d961f
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=${VM_RETENTION:-24}"
      - "--httpListenAddr=:8428"
    volumes:
      - vm-data:/storage
    ports:
      - "127.0.0.1:8428:8428"
    restart: unless-stopped

  # --------------------------------------------------------------- application
  hardware-io:
    image: ghcr.io/viperdavethesnake/bellasreef-hardware-io:${BELLASREEF_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hardware-io
    depends_on:
      nats: { condition: service_healthy }
    # SOLE owner of hardware. Specific device nodes only — never privileged.
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiochip0:/dev/gpiochip0
      # pinctrl reads the live pin mux through the RP1's gpiomem windows;
      # discovery announces only what the mux proves (capabilities.py).
      # ALL FIVE banks are required: pinctrl mmaps the whole gpiolib and
      # exits 255 ("Failed to mmap gpiolib") with any subset — measured
      # in-container 2026-08-13, gpiomem0 alone and 0-3 both fail.
      - /dev/gpiomem0:/dev/gpiomem0
      - /dev/gpiomem1:/dev/gpiomem1
      - /dev/gpiomem2:/dev/gpiomem2
      - /dev/gpiomem3:/dev/gpiomem3
      - /dev/gpiomem4:/dev/gpiomem4
    volumes:
      # DS18B20 read path is sysfs; w1-therm exposes no character device.
      # The kernel object lives under /sys/devices, and /sys/bus/w1 is symlinks
      # into it, so both are needed for the link targets to resolve.
      - /sys/bus/w1:/sys/bus/w1:ro
      - /sys/devices/w1_bus_master1:/sys/devices/w1_bus_master1:ro
      # PWM chip device dir, rw: export/period/duty writes land here. The
      # /sys/class/pwm entries are symlinks into it; the driver resolves them.
      - /sys/devices/platform/axi/1000120000.pcie/1f00098000.pwm:/sys/devices/platform/axi/1000120000.pcie/1f00098000.pwm
      # Chip identity + of_node compatible resolve into the device tree, ro.
      - /sys/class/pwm:/sys/class/pwm:ro
      # No /sys/firmware/devicetree bind mount here — tried it, and it lost to
      # Docker's default masked-paths list, which hides /sys/firmware
      # unconditionally regardless of what's bind-mounted over it. Live
      # finding: the of_node/compatible read in capabilities.py failed
      # in-container ("RP1 PWM0 block found but its compatible is unreadable"),
      # pi-pwm went unannounced, and the bind mount was proven dead weight.
      # security_opt below unmasks the host's real /sys/firmware instead.
    # Docker masks /sys/firmware by default; chip-identity verification reads
    # of_node/compatible through it (capabilities.py). This container's whole
    # purpose is hardware truth — unmasking sysfs paths for it is the least
    # bad option, and it stays unprivileged, non-root, specific-devices-only.
    security_opt:
      - systempaths=unconfined
    group_add: ["${I2C_GID:?}", "${GPIO_GID:?}"]
    user: "1000:1000"
    environment:
      # The documented silent-death trap: without this, hardware-io reads the
      # probe, serves metrics, logs a clean startup, and publishes nothing at
      # all. See CLAUDE.md, "Dev environment".
      BELLASREEF_NATS_URL: nats://nats:4222
      # No timedatectl inside the container. Clock trust is guaranteed by the
      # host: the compose stack is started by a systemd unit ordered
      # After=time-sync.target. Making that an explicit opt-in rather than a
      # silent default is the point — see docs/host-setup.md.
      BELLASREEF_ASSUME_CLOCK_TRUSTED: "1"
      BELLASREEF_LIVENESS_TIMEOUT_S: "15"
      BELLASREEF_LOG_LEVEL: ${BELLASREEF_LOG_LEVEL:-INFO}
    # Deliberately NOT published. health + metrics ride the compose network
    # only. The one container holding /dev should not also own a listening
    # socket on the host. For ad-hoc debugging use
    #   docker compose exec hardware-io python -c "..."
    # rather than making the port permanent.
    #
    # NOTE: nothing scrapes this endpoint, by design. Telemetry reaches
    # VictoriaMetrics through the API's telemetry writer, which records what the
    # spine published rather than sampling a gauge at scrape cadence — and a
    # scrape of hardware-io could not describe an advisory device at all, since
    # hardware-io only emits authoritative ones. See docs/device-classes.md §4.
    expose:
      - "9101"
    # NOTE: Docker does NOT restart a merely *unhealthy* container — this acts
    # on process exit. That is why the service carries its own LivenessGuard,
    # which terminates the process when the supervisor loop stalls. The
    # healthcheck reports; the guard is what actually recovers.
    restart: unless-stopped

  control-engine:
    image: ghcr.io/viperdavethesnake/bellasreef-control-engine:${BELLASREEF_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-engine
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
    # No devices, no group_add. It reaches hardware only through NATS, and the
    # absence of device access here is the enforcement of that.
    user: "1000:1000"
    environment:
      BELLASREEF_NATS_URL: nats://nats:4222
      BELLASREEF_LIGHTING_PROFILES: /config/lighting.json
      BELLASREEF_DATABASE_URL: ${BELLASREEF_DATABASE_URL:?}
      # Global slew: max duty change per second, for schedule-driven and
      # ramp-hold movement (a snap hold is exempt — spec 2026-08-17). 0.05
      # walks 0->100% in 20 s: a visible fade rather than a pop over
      # livestock, without the ~100 s wait David ruled out at the bench
      # (2026-08-17: 0.01 was "way too slow" for a manual ramp).
      BELLASREEF_MAX_DUTY_DELTA_PER_S: "0.05"
      # No timedatectl in the container; the host guarantees clock trust by
      # ordering the stack After=time-sync.target. Explicit, never assumed.
      BELLASREEF_ASSUME_CLOCK_TRUSTED: "1"
      BELLASREEF_LIVENESS_TIMEOUT_S: "15"
      BELLASREEF_METRICS_PORT: "9102"
      BELLASREEF_LOG_LEVEL: ${BELLASREEF_LOG_LEVEL:-INFO}
    volumes:
      - ./config:/config:ro
    expose:
      - "9102"
    restart: unless-stopped

  api:
    image: ghcr.io/viperdavethesnake/bellasreef-api:${BELLASREEF_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      victoria-metrics: { condition: service_started }
    user: "1000:1000"
    environment:
      BELLASREEF_DATABASE_URL: ${BELLASREEF_DATABASE_URL:?}
      BELLASREEF_NATS_URL: nats://nats:4222
      # No timedatectl in the container; the host guarantees clock trust by
      # ordering the stack After=time-sync.target — same declaration the other
      # two app services carry. Its absence here 503'd every createOverride
      # (found live 2026-08-15, the lighting screen's first real hold): the
      # api is the service that clock-gates override deadlines, and it was
      # the one service not told the host had vouched for the clock.
      BELLASREEF_ASSUME_CLOCK_TRUSTED: "1"
      # The telemetry writer lives here: it needs the spine to read and Postgres
      # to resolve each device's control_authority (docs/device-classes.md §4).
      BELLASREEF_VM_URL: http://victoria-metrics:8428
      BELLASREEF_LOG_LEVEL: ${BELLASREEF_LOG_LEVEL:-INFO}
    # The ONE service published to the LAN: clients have to reach it. Bound to
    # all interfaces because the WiFi address changes, per the host facts.
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      # `bellasreef backup --out /backups/...` lands archives on the host here.
      - /home/david/backups:/backups
    restart: unless-stopped

volumes:
  nats-data:
  postgres-data:
  vm-data:
