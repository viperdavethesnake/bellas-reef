[project]
name = "bellasreef-control-engine"
version = "0.1.0"
description = "Control loops, scheduling and interlock supervision. Sole command publisher."
requires-python = ">=3.13"
dependencies = [
    "bellasreef-contracts",
    "bellasreef-service",
    "bellasreef-db",
    "nats-py>=2.9",
    "pydantic>=2.10",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellasreef_control_engine"]
