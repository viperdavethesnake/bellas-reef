[project]
name = "bellasreef-service"
version = "0.1.0"
description = "Shared service plumbing: structured logs, health/metrics endpoint, liveness"
requires-python = ">=3.13"
dependencies = [
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellasreef_service"]
