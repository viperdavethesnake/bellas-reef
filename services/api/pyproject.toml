[project]
name = "bellasreef-api"
version = "0.1.0"
description = "Stateless HTTP front door. REST + WebSocket bridge to NATS."
requires-python = ">=3.13"
dependencies = [
    "bellasreef-contracts",
    "bellasreef-service",
    "bellasreef-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.10",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "nats-py>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellasreef_api"]
