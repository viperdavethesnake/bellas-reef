[project]
name = "bellasreef-api"
version = "0.1.0"
description = "Stateless HTTP front door. REST + WebSocket bridge to NATS."
requires-python = ">=3.13"
dependencies = [
    "bellasreef-contracts",
    "bellasreef-service",
    "bellasreef-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.10",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "nats-py>=2.9",
    # The telemetry writer and the backup command both speak HTTP to
    # VictoriaMetrics. This was already imported by telemetry.py and only
    # resolved because the workspace dev group happens to pull it in — the
    # built image would have failed at import.
    "httpx>=0.28",
    # app.py imports prometheus_client directly for the metrics endpoint
    # (Task 7). Declared here rather than left to resolve transitively
    # through bellasreef-service, which is exactly the mistake the note
    # above already records once for httpx.
    "prometheus-client>=0.21",
]

[project.scripts]
bellasreef = "bellasreef_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellasreef_api"]
