[project]
name = "bellasreef-hardware-io"
version = "0.1.0"
description = "Sole owner of the Pi's hardware. Enforces actuator interlocks locally."
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30",
    "bellasreef-contracts",
    "bellasreef-service",
    "nats-py>=2.9",
    "prometheus-client>=0.21",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellasreef_hardware_io"]
