[project]
name = "bellas-reef"
version = "0.0.0"
description = "Bella's Reef — reef aquarium automation platform (workspace root)"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# services/* join this list as they land; session 1 is contracts + schema only.
members = ["contracts/python", "db", "services/shared", "services/hardware_io", "services/control_engine", "services/api"]

[tool.uv.sources]
bellasreef-contracts = { workspace = true }
bellasreef-db = { workspace = true }
bellasreef-hardware-io = { workspace = true }
bellasreef-service = { workspace = true }
bellasreef-control-engine = { workspace = true }
bellasreef-api = { workspace = true }

[dependency-groups]
dev = [
    # Workspace members, installed editable so tests and mypy see them.
    "bellasreef-contracts",
    "bellasreef-db",
    "bellasreef-hardware-io",
    "bellasreef-service",
    "bellasreef-control-engine",
    "bellasreef-api",
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
    "types-PyYAML>=6.0",
    "ruff>=0.9",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["reference", "db/alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetime use — safety-relevant here
    "RUF",
]

ignore = [
    # Docstrings here are prose and use real typography (en dashes, arrows).
    # Flagging them as "ambiguous unicode" would mean degrading the writing.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
exclude = ["reference/", "db/alembic/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# smbus2 ships no type stubs. Imported lazily and only on a hub that declares a
# PCA9685, so a dev machine without it still runs everything else.
[[tool.mypy.overrides]]
module = ["smbus2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = [
    # Repo-root tests: the environment-boundary guard and the install-hub
    # black-box suite. Not listing this directory meant both only ran when
    # someone named them by hand — CI never collected either.
    "tests",
    "contracts/python/tests",
    "db/tests",
    "services/shared/tests",
    "services/hardware_io/tests",
    "services/control_engine/tests",
    "services/api/tests",
]
addopts = "-q --strict-markers"
markers = [
    "hardware: requires real I2C/GPIO/1-wire on the Pi (never runs in CI)",
]
