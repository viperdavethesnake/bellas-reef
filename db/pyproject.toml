[project]
name = "bellasreef-db"
version = "1.0.0"
description = "Bella's Reef PostgreSQL schema and Alembic migrations"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "bellasreef-service",
    "bellasreef-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellasreef_db"]
