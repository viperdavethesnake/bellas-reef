name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.19"

jobs:
  checks:
    name: lint · types · tests
    runs-on: ubuntu-latest

    # Real Postgres. The constraints under test are Postgres semantics — a
    # CHECK evaluating to NULL passes — and cannot be reproduced against
    # SQLite or a mock. A test that did not use Postgres would have happily
    # passed the NULL-cadence bug this suite now guards.
    services:
      # The telemetry writer's read-back test needs a real store: formatting a
      # correct-looking line and never landing it is the exact failure it exists
      # to catch. A `services:` container is enough here — unlike NATS, no CMD
      # arguments are required.
      victoria-metrics:
        image: victoriametrics/victoria-metrics:v1.149.0
        ports:
          - 8428:8428

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bellasreef
          POSTGRES_PASSWORD: bellasreef
          # NOT `bellasreef`. conftest.py refuses to run the suite against a
          # database with the production name, and that check is what protects
          # a hub if this suite is ever pointed somewhere it should not be.
          # Naming CI's throwaway database after production would mean carving
          # an exception into the guard on day one.
          POSTGRES_DB: bellasreef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BELLASREEF_DATABASE_URL: postgresql+asyncpg://bellasreef:bellasreef@localhost:5432/bellasreef_test
      BELLASREEF_TEST_DATABASE_URL: postgresql+asyncpg://bellasreef:bellasreef@localhost:5432/bellasreef_test
      BELLASREEF_TEST_NATS_URL: nats://localhost:4222
      BELLASREEF_TEST_VM_URL: http://localhost:8428
      # The runner image ships a PostgreSQL 16 client and it wins on PATH, so
      # `pg_dump` resolves to 16 and refuses to dump the 17 server below. Naming
      # the directory explicitly is what BELLASREEF_PG_BIN is for.
      BELLASREEF_PG_BIN: /usr/lib/postgresql/17/bin
      # Runner clock state is not ours to depend on, and override creation is
      # clock-gated. Explicit rather than whatever timedatectl happens to say.
      BELLASREEF_ASSUME_CLOCK_TRUSTED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # NOT a `services:` container: JetStream is opt-in via `--jetstream`,
      # and Actions service containers give no way to pass CMD arguments. A
      # NATS without JetStream would fail every stream test in a way that looks
      # like our bug rather than a missing flag.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats-ci -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine --jetstream --http_port=8222
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz >/dev/null 2>&1; then
              echo "nats ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "nats did not become ready"; docker logs nats-ci; exit 1

      # The backup/restore suite shells out to the real client tools. Version 17
      # to match the server container: pg_dump refuses to dump a server newer
      # than itself, and the runner image ships 16. Without this the suite
      # skips, and a skip for a missing environment fails the gate.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Sync workspace
        run: uv sync --frozen

      # Applied before the gate so the drift test has a real schema to compare
      # the models against.
      - name: Apply migrations
        working-directory: db
        run: uv run alembic upgrade head

      # The identical script developers run. If it passes locally it passes
      # here — no second, subtly different list of commands to drift out of
      # sync.
      - name: Gate
        run: ./scripts/check.sh

      # The spec is a published artefact and the source of truth for every
      # client (PRD §7.3.2). Generated from the app rather than hand-kept, and
      # published from CI so clients pin a build rather than someone's laptop.
      - name: Export client contracts
        run: uv run python scripts/export-openapi.py

      # One artifact, both files: a client that pins the REST spec without the
      # matching frame schema can compile and still misread the stream.
      - name: Upload client contracts
        uses: actions/upload-artifact@v4
        with:
          name: client-contracts
          path: |
            openapi.json
            stream-frames.schema.json
          if-no-files-found: error

  build:
    name: multi-arch build (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # type=cacheonly builds for both architectures and pushes nothing. The
      # point is to catch an arm64-incompatible dependency now rather than on
      # the Pi during a deploy.
      - name: Build base image for amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet
          echo "compose config valid"
